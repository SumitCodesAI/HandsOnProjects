name: Generate Databricks Schema Documentation

on:
  issues:
    types: [assigned]

permissions:
  contents: write
  issues: write

jobs:
  generate-docs:
    if: contains(github.event.issue.title, 'schema') || contains(github.event.issue.title, 'Schema') || contains(github.event.issue.body, 'schema') || contains(github.event.issue.body, 'Schema')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Extract schema from issue
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue && issue.body ? issue.body : '';
            const title = issue && issue.title ? issue.title : '';
            const issueNumber = issue ? issue.number : 'unknown';
            
            console.log('🔍 Debug - Issue event action:', context.payload.action);
            console.log('🔍 Debug - Issue title:', title);
            console.log('🔍 Debug - Issue body:', body.substring(0, 200));
            
            // Look for schema name patterns in issue body/title
            // Pattern 1: "schema: schema_name" or "schema=schema_name" (supports alphanumeric, underscores, hyphens)
            let schemaMatch = body.match(/schema[:\s=]+([a-zA-Z0-9_-]+)/i) || title.match(/schema[:\s=]+([a-zA-Z0-9_-]+)/i);
            
            // Pattern 2: "document schema_name" or "generate docs for schema_name"  
            if (!schemaMatch) {
              schemaMatch = body.match(/(?:document|generate|create docs for|:)\s+([a-zA-Z0-9_-]+)/i) || 
                           title.match(/(?:document|generate|create docs for|:)\s+([a-zA-Z0-9_-]+)/i);
            }
            
            if (!schemaMatch) {
              console.log('⚠️  WARNING: Could not extract schema name from issue/comment text.');
            }
            
            const schema = schemaMatch ? schemaMatch[1] : '';
            
            // Look for catalog (support alphanumeric, underscores, hyphens)
            const catalogMatch = body.match(/catalog[:\s=]+([a-zA-Z0-9_-]+)/i);
            const catalog = catalogMatch ? catalogMatch[1] : 'workspace';
            
            console.log(`✅ Extracted: catalog=${catalog}, schema=${schema}, issue=${issueNumber}`);
            
            core.setOutput('catalog', catalog);
            core.setOutput('schema', schema);
            core.setOutput('issue_number', issueNumber);
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests pandas openpyxl

      - name: Validate Databricks configuration
        env:
          DATABRICKS_HOST: ${{ secrets['DATABRICKS_HOST'] || vars['DATABRICKS_HOST'] }}
          DATABRICKS_TOKEN: ${{ secrets['DATABRICKS_TOKEN'] || vars['DATABRICKS_TOKEN'] }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::error::DATABRICKS_HOST is not set. Add it in Repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::error::DATABRICKS_TOKEN is not set. Add it in Repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Databricks configuration found."

      - name: Test Databricks connectivity
        env:
          DATABRICKS_HOST: ${{ secrets['DATABRICKS_HOST'] || vars['DATABRICKS_HOST'] }}
          DATABRICKS_TOKEN: ${{ secrets['DATABRICKS_TOKEN'] || vars['DATABRICKS_TOKEN'] }}
        run: |
          HOST="${DATABRICKS_HOST%/}"
          if [[ "$HOST" != http://* && "$HOST" != https://* ]]; then
            HOST="https://$HOST"
          fi

          # Test Unity Catalog access — the same endpoint the script uses.
          UC_STATUS=$(curl -sS -o /tmp/dbx_uc_schemas.json -w "%{http_code}" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$HOST/api/2.1/unity-catalog/schemas?catalog_name=workspace&max_results=1")

          echo "Unity Catalog /schemas probe returned HTTP $UC_STATUS"
          UC_BODY=$(cat /tmp/dbx_uc_schemas.json 2>/dev/null || true)

          if [ "$UC_STATUS" == "000" ]; then
            echo "::error::Could not reach Databricks at $HOST. Verify DATABRICKS_HOST is correct (e.g. https://adb-xxxx.azuredatabricks.net)."
            exit 1
          fi
          if [ "$UC_STATUS" == "401" ]; then
            echo "::error::Databricks token rejected (HTTP 401). DATABRICKS_TOKEN is invalid or expired. Generate a new token at $HOST → User Settings → Developer → Access tokens."
            echo "$UC_BODY" | head -c 500 || true
            exit 1
          fi
          if [ "$UC_STATUS" == "403" ]; then
            # Check if this is a scope error (token exists but lacks required permissions)
            if echo "$UC_BODY" | grep -q "required scopes"; then
              echo "::error::DATABRICKS_TOKEN is missing required API scopes. Databricks requires you to create a new token with the 'unity-catalog' scope enabled."
              echo ""
              echo "How to fix:"
              echo "  1. Go to $HOST"
              echo "  2. Click your profile → Settings → Developer → Access tokens"
              echo "  3. Click 'Generate new token'"
              echo "  4. In the token creation dialog, enable the scope: unity-catalog"
              echo "  5. Copy the new token"
              echo "  6. Update the DATABRICKS_TOKEN secret in: GitHub repo → Settings → Secrets and variables → Actions"
              echo ""
              echo "API response: $UC_BODY" | head -c 300 || true
              exit 1
            fi
          fi

          echo "Databricks connectivity verified (HTTP $UC_STATUS)."
      
      - name: Generate schema documentation
        env:
          DATABRICKS_HOST: ${{ secrets['DATABRICKS_HOST'] || vars['DATABRICKS_HOST'] }}
          DATABRICKS_TOKEN: ${{ secrets['DATABRICKS_TOKEN'] || vars['DATABRICKS_TOKEN'] }}
        run: |
          CATALOG="${{ steps.extract.outputs.catalog }}"
          SCHEMA="${{ steps.extract.outputs.schema }}"
          FORMAT="both"
          echo "📋 Using extracted schema from issue: $CATALOG.$SCHEMA"
          
          # Validate schema was extracted
          if [ -z "$SCHEMA" ] || [ "$SCHEMA" == ""  ]; then
            echo "::error::No schema name extracted from issue. Please provide 'schema: name' in issue body or title."
            exit 1
          fi
          
          echo "📊 Generating $FORMAT documentation for $CATALOG.$SCHEMA"
          python scripts/databricks_documenter.py --catalog "$CATALOG" --schema "$SCHEMA" --format "$FORMAT"
      
      - name: Commit and push documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if docs were generated
          if [ ! -d "docs/databricks" ] || [ -z "$(ls -A docs/databricks 2>/dev/null)" ]; then
            echo "⚠️  No documentation files generated. Check Databricks API call output above."
            exit 1
          fi
          
          git add docs/databricks/
          git commit -m "docs: add schema documentation for ${{ steps.extract.outputs.schema }}" || echo "No changes to commit"
          git push
      
      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const catalog = '${{ steps.extract.outputs.catalog }}';
            const schema = '${{ steps.extract.outputs.schema }}';
            const excelFile = `docs/databricks/${schema}_schema_and_data.xlsx`;
            const mdFile = `docs/databricks/${schema}_SCHEMA.md`;
            
            github.rest.issues.createComment({
              issue_number: ${{ steps.extract.outputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Databricks schema documentation generated automatically!**\n\n📊 **Schema:** ${catalog}.${schema}\n\n📁 **Files:**\n- [📊 Excel Schema](${excelFile})\n- [📄 Markdown](${mdFile})\n\n**Note:** Schema definitions only (no sample data rows)\n\n---\n*Triggered automatically by @DataEngineer agent*`
            });
