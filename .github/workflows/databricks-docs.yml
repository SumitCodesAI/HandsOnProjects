name: Generate Databricks Schema Documentation

on:
  workflow_dispatch:
    inputs:
      catalog:
        description: 'Catalog name'
        required: true
        default: 'workspace'
      schema:
        description: 'Schema name'
        required: true
        default: 'healthcare_claims'
      format:
        description: 'Output format'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - excel
          - markdown
  
  issues:
    types: [labeled]

jobs:
  generate-docs:
    # Only run if issue has 'databricks-docs' label
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'databricks-docs')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests pandas openpyxl
      
      - name: Generate schema documentation
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          CATALOG="${{ github.event.inputs.catalog || 'workspace' }}"
          SCHEMA="${{ github.event.inputs.schema || 'healthcare_claims' }}"
          FORMAT="${{ github.event.inputs.format || 'both' }}"
          
          echo "Generating $FORMAT documentation for $CATALOG.$SCHEMA"
          python scripts/databricks_documenter.py --catalog "$CATALOG" --schema "$SCHEMA" --format "$FORMAT"
      
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/databricks/
          git commit -m "docs: update schema documentation for ${{ github.event.inputs.schema || 'healthcare_claims' }}" || echo "No changes to commit"
          git push
      
      - name: Comment on issue (if triggered by issue)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const schema = 'healthcare_claims';
            const excelFile = `docs/databricks/${schema}_schema_and_data.xlsx`;
            const mdFile = `docs/databricks/${schema}_SCHEMA.md`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Databricks schema documentation generated!**\n\n📊 **Schema:** workspace.${schema}\n\n📁 **Files:**\n- [📊 Excel Schema](${excelFile})\n- [📄 Markdown](${mdFile})\n\n**Note:** Schema definitions only (no sample data rows)`
            });
