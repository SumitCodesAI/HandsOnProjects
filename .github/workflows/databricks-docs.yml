name: Generate Databricks Schema Documentation

on:
  workflow_dispatch:
    inputs:
      catalog:
        description: 'Catalog name'
        required: true
        default: 'workspace'
      schema:
        description: 'Schema name'
        required: true
        default: 'healthcare_claims'
  
  issues:
    types: [labeled]

jobs:
  generate-docs:
    # Only run if issue has 'databricks-docs' label
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'databricks-docs')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Generate schema documentation
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # Use inputs from workflow_dispatch or defaults from issue
          CATALOG="${{ github.event.inputs.catalog || 'workspace' }}"
          SCHEMA="${{ github.event.inputs.schema || 'healthcare_claims' }}"
          
          echo "Generating docs for $CATALOG.$SCHEMA"
          python scripts/databricks_documenter.py --catalog "$CATALOG" --schema "$SCHEMA"
      
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/databricks/
          git commit -m "docs: update schema documentation for ${{ github.event.inputs.schema || 'healthcare_claims' }}" || echo "No changes to commit"
          git push
      
      - name: Comment on issue (if triggered by issue)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const schema = 'healthcare_claims';
            const filePath = `docs/databricks/${schema}_SCHEMA.md`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Databricks schema documentation generated!**\n\n📊 Schema: workspace.${schema}\n📁 File: [${schema}_SCHEMA.md](${filePath})\n\nThe documentation has been committed to the repository.`
            });
