name: Generate Databricks Schema Documentation

on:
  workflow_dispatch:
    inputs:
      catalog:
        description: 'Catalog name'
        required: true
        default: 'workspace'
      schema:
        description: 'Schema name'
        required: true
        default: 'healthcare_claims'
      format:
        description: 'Output format'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - excel
          - markdown
  
  issues:
    types: [opened, edited, assigned]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write

jobs:
  generate-docs:
    # Run on manual workflow dispatch OR when issue mentions DataEngineer
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'issues' && (
        github.event.action == 'assigned' ||
        contains(github.event.issue.body, '@DataEngineer') ||
        contains(github.event.issue.title, 'DataEngineer')
      )) ||
      (github.event_name == 'issue_comment' && (
        contains(github.event.comment.body, '@DataEngineer')
      ))
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Extract schema from issue/comment
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const commentBody = context.payload.comment?.body || '';
            const body = issue && issue.body ? [commentBody, issue.body].filter(Boolean).join('\n') : commentBody;
            const title = issue && issue.title ? issue.title : '';
            const issueNumber = issue ? issue.number : 'unknown';
            
            console.log('🔍 Debug - Issue event action:', context.payload.action);
            console.log('🔍 Debug - Issue title:', title);
            console.log('🔍 Debug - Issue body:', body.substring(0, 200));
            
            // Look for schema name patterns in issue body/title
            // Pattern 1: "schema: schema_name" or "schema=schema_name" (supports alphanumeric, underscores, hyphens)
            let schemaMatch = body.match(/schema[:\s=]+([a-zA-Z0-9_-]+)/i) || title.match(/schema[:\s=]+([a-zA-Z0-9_-]+)/i);
            
            // Pattern 2: "document schema_name" or "generate docs for schema_name"  
            if (!schemaMatch) {
              schemaMatch = body.match(/(?:document|generate|create docs for|:)\s+([a-zA-Z0-9_-]+)/i) || 
                           title.match(/(?:document|generate|create docs for|:)\s+([a-zA-Z0-9_-]+)/i);
            }
            
            if (!schemaMatch) {
              console.log('⚠️  WARNING: Could not extract schema name from issue. Using default: healthcare_claims');
            }
            
            const schema = schemaMatch ? schemaMatch[1] : 'healthcare_claims';
            
            // Look for catalog (support alphanumeric, underscores, hyphens)
            const catalogMatch = body.match(/catalog[:\s=]+([a-zA-Z0-9_-]+)/i);
            const catalog = catalogMatch ? catalogMatch[1] : 'workspace';
            
            console.log(`✅ Extracted: catalog=${catalog}, schema=${schema}, issue=${issueNumber}`);
            
            core.setOutput('catalog', catalog);
            core.setOutput('schema', schema);
            core.setOutput('issue_number', issueNumber);
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests pandas openpyxl

      - name: Validate Databricks configuration
        env:
          DATABRICKS_HOST: ${{ secrets['DATABRICKS_HOST'] || vars['DATABRICKS_HOST'] }}
          DATABRICKS_TOKEN: ${{ secrets['DATABRICKS_TOKEN'] || vars['DATABRICKS_TOKEN'] }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::error::DATABRICKS_HOST is not set. Add it in Repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::error::DATABRICKS_TOKEN is not set. Add it in Repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Databricks configuration found."

      - name: Test Databricks connectivity
        env:
          DATABRICKS_HOST: ${{ secrets['DATABRICKS_HOST'] || vars['DATABRICKS_HOST'] }}
          DATABRICKS_TOKEN: ${{ secrets['DATABRICKS_TOKEN'] || vars['DATABRICKS_TOKEN'] }}
        run: |
          HOST="${DATABRICKS_HOST%/}"
          if [[ "$HOST" != http://* && "$HOST" != https://* ]]; then
            HOST="https://$HOST"
          fi

          USER_STATUS=$(curl -sS -o /tmp/dbx_current_user.json -w "%{http_code}" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$HOST/api/2.0/current-user")

          if [ "$USER_STATUS" != "200" ]; then
            echo "::error::Databricks auth/connectivity failed at /api/2.0/current-user (HTTP $USER_STATUS). Check DATABRICKS_HOST and DATABRICKS_TOKEN."
            echo "Response:"
            head -c 500 /tmp/dbx_current_user.json || true
            exit 1
          fi

          UC_STATUS=$(curl -sS -o /tmp/dbx_uc_catalogs.json -w "%{http_code}" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$HOST/api/2.1/unity-catalog/catalogs")

          if [ "$UC_STATUS" != "200" ]; then
            echo "::error::Unity Catalog access failed at /api/2.1/unity-catalog/catalogs (HTTP $UC_STATUS). Token may lack UC permissions."
            echo "Response:"
            head -c 500 /tmp/dbx_uc_catalogs.json || true
            exit 1
          fi

          echo "Databricks connectivity and Unity Catalog access verified."
      
      - name: Generate schema documentation
        env:
          DATABRICKS_HOST: ${{ secrets['DATABRICKS_HOST'] || vars['DATABRICKS_HOST'] }}
          DATABRICKS_TOKEN: ${{ secrets['DATABRICKS_TOKEN'] || vars['DATABRICKS_TOKEN'] }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CATALOG="${{ github.event.inputs.catalog }}"
            SCHEMA="${{ github.event.inputs.schema }}"
            FORMAT="${{ github.event.inputs.format }}"
          else
            CATALOG="${{ steps.extract.outputs.catalog }}"
            SCHEMA="${{ steps.extract.outputs.schema }}"
            FORMAT="both"
          fi
          
          # Validate schema was extracted
          if [ -z "$SCHEMA" ] || [ "$SCHEMA" == ""  ]; then
            echo "::error::No schema name extracted from issue. Please provide 'schema: name' in issue body or title."
            exit 1
          fi
          
          echo "📊 Generating $FORMAT documentation for $CATALOG.$SCHEMA"
          python scripts/databricks_documenter.py --catalog "$CATALOG" --schema "$SCHEMA" --format "$FORMAT"
      
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/databricks/
          git commit -m "docs: add schema documentation for ${{ steps.extract.outputs.schema || github.event.inputs.schema }}" || echo "No changes to commit"
          git push
      
      - name: Comment on issue (if triggered by issue)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const catalog = '${{ steps.extract.outputs.catalog }}';
            const schema = '${{ steps.extract.outputs.schema }}';
            const excelFile = `docs/databricks/${schema}_schema_and_data.xlsx`;
            const mdFile = `docs/databricks/${schema}_SCHEMA.md`;
            
            github.rest.issues.createComment({
              issue_number: ${{ steps.extract.outputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Databricks schema documentation generated automatically!**\n\n📊 **Schema:** ${catalog}.${schema}\n\n📁 **Files:**\n- [📊 Excel Schema](${excelFile})\n- [📄 Markdown](${mdFile})\n\n**Note:** Schema definitions only (no sample data rows)\n\n---\n*Triggered automatically by @DataEngineer agent*`
            });
